[package]
name = "sweaxdrop-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
data-encoding = "2.11.1"
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
parking_lot = "0.13.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = "0.6.5"
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
parking_lot = "0.13.0"
rand = "0.8"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
