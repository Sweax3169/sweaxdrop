[package]
name = "sweaxdrop-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SweaxDrop for Windows"

[[bin]]
name = "sweaxdrop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sweaxdrop-core = { path = "../../../crates/core", features = ["embed-ui"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winreg = "0.56.0"
