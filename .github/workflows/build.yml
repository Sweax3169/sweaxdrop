name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sweaxdrop-core

  ui:
    name: Shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: ui
      - run: npx vite build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with: { name: ui-dist, path: ui/dist }

  windows:
    name: Windows installer
    needs: [ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: ui/dist }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build
        working-directory: apps/desktop
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item target/release/bundle/nsis/*.exe "out/SweaxDrop-$v-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  android:
    name: Android APK
    needs: [ui]
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: ui/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,x86_64-linux-android' }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cargo install cargo-ndk --locked
      - name: Build the core for Android
        run: cargo ndk -t arm64-v8a -t x86_64 -P 29 -o apps/android/app/src/main/jniLibs build --release -p sweaxdrop-ffi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Keystore
        if: env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > ${{ runner.temp }}/release.jks
      - name: Build APK
        working-directory: apps/android
        env:
          SWEAXDROP_KEYSTORE: ${{ runner.temp }}/release.jks
          SWEAXDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SWEAXDROP_KEY_ALIAS: sweaxdrop
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../out
          V=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk ../../out/SweaxDrop-$V-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  ios:
    name: iOS app (unsigned)
    needs: [ui]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: ui/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@v2
      - name: Build the core for iOS
        run: |
          cargo build --release --target aarch64-apple-ios -p sweaxdrop-ffi
          mkdir -p apps/ios/lib apps/ios/ui
          cp target/aarch64-apple-ios/release/libsweaxdrop.a apps/ios/lib/
          cp -R ui/dist/. apps/ios/ui/
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (no code signing)
        working-directory: apps/ios
        run: |
          xcodebuild -project SweaxDrop.xcodeproj -scheme SweaxDrop -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60
          test -d build/Build/Products/Release-iphoneos/SweaxDrop.app
      - name: Package .ipa
        working-directory: apps/ios
        run: |
          mkdir -p Payload ../../out
          cp -R build/Build/Products/Release-iphoneos/SweaxDrop.app Payload/
          zip -qry ../../out/SweaxDrop-1.0.0-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/* }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, pattern: '{windows,android,ios}' }
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=${GITHUB_REF_NAME}
          NOTES=docs/release-notes/${TAG}.md
          gh release create "$TAG" dist/* --title "SweaxDrop ${TAG#v}" --notes-file "$NOTES" || gh release upload "$TAG" dist/* --clobber
