[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/bench"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Sweax3169/sweaxdrop"
authors = ["Sweax Studios"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
